name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore private signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.EGER_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing keystore secret"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/eger-release.jks"
          test -s "$RUNNER_TEMP/eger-release.jks"
          echo "EGER_KEYSTORE_PATH=$RUNNER_TEMP/eger-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          EGER_STORE_PASSWORD: ${{ secrets.EGER_STORE_PASSWORD }}
          EGER_KEY_ALIAS: ${{ secrets.EGER_KEY_ALIAS }}
          EGER_KEY_PASSWORD: ${{ secrets.EGER_KEY_PASSWORD }}
        run: |
          test -n "$EGER_STORE_PASSWORD" && test -n "$EGER_KEY_ALIAS" && test -n "$EGER_KEY_PASSWORD"
          gradle --no-daemon assembleRelease
      - name: Verify signed APK
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
      - name: Name APK using actual application version
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          test -n "$VERSION" || { echo "Missing versionName"; exit 1; }
          APK=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          test -n "$APK"
          mv "$APK" "app/build/outputs/apk/release/EgerGPS-v${VERSION}.apk"
          echo "APK_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: EgerGPS-v${{ env.APK_VERSION }}-signed-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
